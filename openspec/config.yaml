# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: TanStack Start (React 19, TanStack Router/Query) SPA on Vite 8; TypeScript 5.8 strict; Tailwind CSS 4; npm; Node 24.18
  Architecture: Static SPA deployed to GitHub Pages (SPA mode, main branch); route-driven pages under src/routes; shadcn/ui components
  Testing: No test framework detected (unit/integration/E2E unavailable) — strict TDD disabled
  Style: Prettier 100 cols, semi, double quotes, trailing commas; ESLint 9 flat config (typescript-eslint); `@/*` alias to src/*

strict_tdd: false

testing:
  test_command: ""
  unit: false
  integration: false
  e2e: false
  coverage_command: ""
  linter: "npm run lint"
  type_checker: "npx tsc --noEmit"
  formatter: "npm run format"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false # No test runner installed; strict TDD unavailable
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build" # deploy build: npm run build:pages (requires GITHUB_PAGES=1)
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
